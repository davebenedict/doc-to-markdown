<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc to Markdown Converter v2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #2a2a2a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 500;
        }
        .why-btn {
            background: #1f6aa5;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .why-btn:hover {
            background: #2a7ab8;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .drop-section {
            background: #2a2a2a;
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .drop-section:hover, .drop-section.dragover {
            border-color: #1f6aa5;
            background: #333;
        }
        .drop-section p {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .formats-dropdown {
            margin-top: 15px;
        }
        .formats-dropdown button {
            background: #333;
            border: 1px solid #444;
            color: #888;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .formats-dropdown button:hover {
            background: #444;
        }
        .formats-content {
            display: none;
            margin-top: 15px;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
        }
        .formats-content.show {
            display: block;
        }
        .format-group {
            margin-bottom: 15px;
        }
        .format-group h4 {
            color: #888;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .format-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .format-badge {
            background: #333;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #aaa;
        }
        .gdrive-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .gdrive-section h3 {
            margin-bottom: 10px;
            font-size: 1rem;
            color: #888;
        }
        .gdrive-input {
            display: flex;
            gap: 10px;
        }
        .gdrive-input input {
            flex: 1;
            background: #333;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .gdrive-input button {
            background: #1f6aa5;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .gdrive-input button:hover {
            background: #2a7ab8;
        }
        .output-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .output-section h3 {
            margin-bottom: 15px;
            font-size: 1rem;
            color: #888;
        }
        .output-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .output-row input {
            flex: 1;
            background: #333;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .output-row button {
            background: #333;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .output-row button:hover {
            background: #444;
        }
        .checkbox-row {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .checkbox-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #888;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .checkbox-row input[type="checkbox"] {
            cursor: pointer;
        }
        .token-toggle {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
        }
        .token-toggle button {
            flex: 1;
            background: #333;
            border: 1px solid #444;
            color: #888;
            padding: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            border-radius: 0;
        }
        .token-toggle button:first-child {
            border-radius: 6px 0 0 6px;
        }
        .token-toggle button:last-child {
            border-radius: 0 6px 6px 0;
        }
        .token-toggle button.active {
            background: #1f6aa5;
            color: white;
            border-color: #1f6aa5;
        }
        .token-toggle button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .file-list {
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }
        .file-list-header {
            display: grid;
            grid-template-columns: 40px 200px 70px 90px 90px 90px 80px 140px;
            background: #333;
            padding: 12px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #888;
            border-bottom: 1px solid #444;
        }
        .file-item {
            display: grid;
            grid-template-columns: 40px 200px 70px 90px 90px 90px 80px 140px;
            padding: 12px;
            border-bottom: 1px solid #333;
            align-items: center;
            font-size: 0.9rem;
        }
        .file-item:hover {
            background: #333;
        }
        .file-icon {
            text-align: center;
            font-size: 1.2rem;
        }
        .file-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-tokens {
            text-align: right;
            color: #888;
        }
        .file-original {
            text-align: right;
            color: #888;
        }
        .file-converted {
            text-align: right;
            color: #888;
        }
        .file-savings {
            text-align: right;
            color: #4caf50;
            font-weight: 500;
        }
        .file-tokenizer {
            text-align: right;
            color: #888;
            font-size: 0.85rem;
        }
        .file-actions {
            text-align: right;
        }
        .file-actions button {
            background: #333;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 4px;
        }
        .file-actions button:hover {
            background: #444;
        }
        .status-bar {
            background: #2a2a2a;
            padding: 10px 20px;
            border-top: 1px solid #333;
            font-size: 0.9rem;
            color: #888;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-text {
            flex: 1;
        }
        .status-text.error {
            color: #f44336;
        }
        .status-text.success {
            color: #4caf50;
        }
        #fileInput {
            display: none;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .tiktoken-hint {
            background: #3a2a1a;
            border: 1px solid #5a4a3a;
            color: #ffaa55;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .tiktoken-hint button {
            background: #1f6aa5;
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Doc → Markdown Converter v2.0</h1>
        <button class="why-btn" onclick="showWhyModal()">? Why use this</button>
    </div>

    <div class="main-content">
        <div class="tiktoken-hint" id="tiktokenHint" style="display: none;">
            For exact token counting, install tiktoken:
            <button onclick="installTiktoken()">pip install tiktoken</button>
        </div>

        <div class="token-toggle">
            <button id="tiktokenBtn" onclick="setTokenMode('tiktoken')">tiktoken (exact)</button>
            <button id="fileSizeBtn" class="active" onclick="setTokenMode('filesize')">file size (approx)</button>
        </div>

        <div class="drop-section" id="dropZone">
            <p>Drag & drop files here, or click to browse</p>
            <input type="file" id="fileInput" multiple>
            <div class="formats-dropdown">
                <button onclick="toggleFormats()">View supported formats ▾</button>
                <div class="formats-content" id="formatsContent">
                    <div id="formatsList">
                        <span style="color: #666;">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="gdrive-section">
            <h3>Google Drive URL</h3>
            <div class="gdrive-input">
                <input type="text" id="gdriveUrl" placeholder="Paste Google Drive URL here...">
                <button onclick="convertGDrive()">Convert</button>
            </div>
        </div>

        <div class="output-section">
            <h3>Output folder</h3>
            <div class="output-row">
                <input type="text" id="outputDir" placeholder="Same as input folder" readonly>
                <button onclick="browseOutput()">Browse</button>
                <button onclick="clearOutput()">Clear</button>
            </div>
            <div class="checkbox-row">
                <label>
                    <input type="checkbox" id="rememberDir" onchange="saveConfig()">
                    Remember
                </label>
                <label>
                    <input type="checkbox" id="datetimeSubfolder" onchange="saveConfig()">
                    Date subfolder
                </label>
            </div>
        </div>

        <div class="file-list">
            <div class="file-list-header">
                <div></div>
                <div>File</div>
                <div style="text-align: right">Tokens</div>
                <div style="text-align: right">Original</div>
                <div style="text-align: right">Converted</div>
                <div style="text-align: right">Savings</div>
                <div style="text-align: right">Tokenizer</div>
            </div>
            <div id="fileList">
                <div class="empty-state">No files converted yet</div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <span class="status-text" id="statusText">Ready</span>
        <span id="fileCount">0 files converted</span>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('statusText');
        const fileList = document.getElementById('fileList');
        const fileCount = document.getElementById('fileCount');
        const formatsList = document.getElementById('formatsList');
        const formatsContent = document.getElementById('formatsContent');
        const outputDir = document.getElementById('outputDir');
        const rememberDir = document.getElementById('rememberDir');
        const datetimeSubfolder = document.getElementById('datetimeSubfolder');
        const tiktokenBtn = document.getElementById('tiktokenBtn');
        const fileSizeBtn = document.getElementById('fileSizeBtn');
        const tiktokenHint = document.getElementById('tiktokenHint');

        let tokenMode = 'filesize';
        let convertedFiles = [];
        let tiktokenChecked = false;

        // Load config on startup
        loadConfig();
        loadConvertedFiles();
        
        // Only check tiktoken once
        if (!tiktokenChecked) {
            checkTiktoken();
            tiktokenChecked = true;
        }

        // Load supported formats
        fetch('/supported-formats')
            .then(r => r.json())
            .then(data => {
                const formats = data.formats;
                const missing = data.missing_deps;
                
                let html = '<div class="format-group"><h4>Significant token savings</h4><div class="format-badges">';
                const savingsFormats = ['.html', '.htm', '.epub', '.xml', '.rtf', '.xlsx', '.xls', '.pptx', '.csv'];
                savingsFormats.forEach(f => {
                    if (formats.includes(f)) {
                        const hint = missing[f] ? ` (pip install ${missing[f]})` : '';
                        html += `<span class="format-badge" style="${missing[f] ? 'color: #ff6b6b;' : ''}">${f}${hint}</span>`;
                    }
                });
                html += '</div></div>';
                
                html += '<div class="format-group"><h4>Structural quality</h4><div class="format-badges">';
                const qualityFormats = ['.pdf', '.docx', '.odt', '.json'];
                qualityFormats.forEach(f => {
                    if (formats.includes(f)) {
                        const hint = missing[f] ? ` (pip install ${missing[f]})` : '';
                        html += `<span class="format-badge" style="${missing[f] ? 'color: #ff6b6b;' : ''}">${f}${hint}</span>`;
                    }
                });
                html += '</div></div>';
                
                html += '<div class="format-group"><h4>Image/OCR</h4><div class="format-badges">';
                const ocrFormats = ['.jpg', '.jpeg', '.png', '.tiff', '.tif', '.bmp'];
                ocrFormats.forEach(f => {
                    if (formats.includes(f)) {
                        const hint = missing[f] ? ` (pip install ${missing[f]})` : '';
                        html += `<span class="format-badge" style="${missing[f] ? 'color: #ff6b6b;' : ''}">${f}${hint}</span>`;
                    }
                });
                html += '</div></div>';
                
                formatsList.innerHTML = html;
            });

        function loadConfig() {
            fetch('/config')
                .then(r => r.json())
                .then(config => {
                    if (config.output_dir) {
                        outputDir.value = config.output_dir;
                    }
                    if (config.remember_output_dir) {
                        rememberDir.checked = true;
                    }
                    if (config.datetime_subfolder) {
                        datetimeSubfolder.checked = true;
                    }
                });
        }

        function saveConfig() {
            const config = {
                output_dir: outputDir.value,
                remember_output_dir: rememberDir.checked,
                datetime_subfolder: datetimeSubfolder.checked
            };
            fetch('/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            });
        }

        function loadConvertedFiles() {
            fetch('/converted-files')
                .then(r => r.json())
                .then(files => {
                    convertedFiles = files;
                    renderFileList();
                });
        }

        function renderFileList() {
            if (convertedFiles.length === 0) {
                fileList.innerHTML = '<div class="empty-state">No files converted yet</div>';
                fileCount.textContent = '0 files converted';
                return;
            }

            fileList.innerHTML = convertedFiles.map((file, index) => `
                <div class="file-item">
                    <div class="file-icon">📄</div>
                    <div class="file-name">${file.name}</div>
                    <div class="file-tokens">${file.tokens.toLocaleString()}</div>
                    <div class="file-original">${formatSize(file.original_size)}</div>
                    <div class="file-converted">${formatSize(file.converted_size)}</div>
                    <div class="file-savings">${file.savings}%</div>
                    <div class="file-tokenizer">${file.tokenizer || 'N/A'}</div>
                    <div class="file-actions">
                        <button onclick="openFile(${index})">Open</button>
                        <button onclick="revealFile(${index})">Reveal</button>
                    </div>
                </div>
            `).join('');

            fileCount.textContent = `${convertedFiles.length} file${convertedFiles.length !== 1 ? 's' : ''} converted`;
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function checkTiktoken() {
            fetch('/tiktoken-available')
                .then(r => r.json())
                .then(data => {
                    if (data.available) {
                        tiktokenBtn.disabled = false;
                    } else {
                        tiktokenBtn.disabled = true;
                        tiktokenHint.style.display = 'block';
                    }
                })
                .catch(() => {
                    tiktokenBtn.disabled = true;
                    tiktokenHint.style.display = 'block';
                });
        }

        function installTiktoken() {
            alert('Please run: pip install tiktoken\nThen restart the application.');
        }

        function setTokenMode(mode) {
            tokenMode = mode;
            tiktokenBtn.classList.toggle('active', mode === 'tiktoken');
            fileSizeBtn.classList.toggle('active', mode === 'filesize');
        }

        function toggleFormats() {
            formatsContent.classList.toggle('show');
        }

        function browseOutput() {
            if (window.electronAPI) {
                window.electronAPI.selectFolder().then(result => {
                    if (!result.canceled && result.filePaths.length > 0) {
                        outputDir.value = result.filePaths[0];
                        saveConfig();
                    }
                });
            }
        }

        function clearOutput() {
            outputDir.value = '';
            saveConfig();
        }

        function showWhyModal() {
            alert('Converting to Markdown:\n\n• Better LLM comprehension\n• Better RAG chunking\n• Bypass file size limits\n• Real token savings\n• Portable and reusable');
        }

        function openFile(index) {
            const file = convertedFiles[index];
            if (window.electronAPI) {
                window.electronAPI.openFile(file.path).then(result => {
                    if (!result.success) {
                        alert(`Failed to open file: ${result.error}`);
                    }
                });
            } else {
                alert(`Opening ${file.name}...\n(File path: ${file.path})`);
            }
        }

        function revealFile(index) {
            const file = convertedFiles[index];
            if (window.electronAPI) {
                window.electronAPI.revealFile(file.path).then(result => {
                    if (!result.success) {
                        alert(`Failed to reveal file: ${result.error}`);
                    }
                });
            } else {
                alert(`Revealing ${file.name} in file explorer...\n(File path: ${file.path})`);
            }
        }

        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                uploadFiles(files);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                uploadFiles(fileInput.files);
            }
        });

        async function uploadFiles(files) {
            for (const file of files) {
                await uploadFile(file);
            }
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('token_mode', tokenMode);

            statusText.textContent = `Converting ${file.name}...`;
            statusText.className = 'status-text';

            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'Conversion failed');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name.replace(/\.[^/.]+$/, '') + '.md';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                statusText.textContent = `Successfully converted ${file.name}!`;
                statusText.className = 'status-text success';

                // Reload file list
                loadConvertedFiles();
            } catch (error) {
                statusText.textContent = `Error: ${error.message}`;
                statusText.className = 'status-text error';
            }
        }

        async function convertGDrive() {
            const url = document.getElementById('gdriveUrl').value;
            if (!url) {
                alert('Please enter a Google Drive URL');
                return;
            }

            statusText.textContent = 'Converting Google Drive file...';
            statusText.className = 'status-text';

            try {
                const response = await fetch('/convert-gdrive', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, token_mode: tokenMode })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'Conversion failed');
                }

                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = 'converted.md';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(downloadUrl);
                document.body.removeChild(a);

                statusText.textContent = 'Successfully converted Google Drive file!';
                statusText.className = 'status-text success';

                // Reload file list
                loadConvertedFiles();
            } catch (error) {
                statusText.textContent = `Error: ${error.message}`;
                statusText.className = 'status-text error';
            }
        }
    </script>
</body>
</html>
