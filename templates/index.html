<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc to Markdown Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .drop-zone {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #2a2a2a;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #1f6aa5;
            background: #2a2a2a;
        }
        .drop-zone p {
            color: #888;
            font-size: 1.1rem;
        }
        #fileInput {
            display: none;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .status.success {
            background: #1a5a1a;
            color: #4caf50;
        }
        .status.error {
            background: #5a1a1a;
            color: #f44336;
        }
        .status.info {
            background: #1a1a5a;
            color: #2196f3;
        }
        .formats {
            margin-top: 30px;
            text-align: center;
        }
        .formats h3 {
            margin-bottom: 10px;
            color: #888;
        }
        .formats-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        .format-badge {
            background: #333;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Doc → Markdown Converter</h1>
        
        <div class="drop-zone" id="dropZone">
            <p>Drag & drop a file here, or click to browse</p>
            <input type="file" id="fileInput">
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="formats">
            <h3>Supported Formats</h3>
            <div class="formats-list" id="formatsList">
                <span style="color: #666;">Loading...</span>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const formatsList = document.getElementById('formatsList');

        // Load supported formats
        fetch('/supported-formats')
            .then(r => r.json())
            .then(data => {
                formatsList.innerHTML = data.formats.map(f => 
                    `<span class="format-badge">${f}</span>`
                ).join('');
            });

        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                uploadFile(files[0]);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                uploadFile(fileInput.files[0]);
            }
        });

        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            status.style.display = 'block';
            status.className = 'status info';
            status.textContent = `Converting ${file.name}...`;

            fetch('/convert', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Conversion failed');
                }
                return response.blob();
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name.replace(/\.[^/.]+$/, '') + '.md';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                status.className = 'status success';
                status.textContent = `Successfully converted ${file.name}!`;
            })
            .catch(error => {
                status.className = 'status error';
                status.textContent = `Error: ${error.message}`;
            });
        }
    </script>
</body>
</html>
